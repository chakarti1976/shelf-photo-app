# One-click deploy of the stock valuation app on Render (free plan).
services:
  - type: web
    name: stock-valuation
    runtime: python
    plan: free
    rootDir: stock-valuation
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Free Postgres connection string (e.g. from neon.tech) — keeps saved
      # valuations across restarts. Render asks for it on first deploy.
      - key: DATABASE_URL
        sync: false
      # Optional: password for the whole site (leave empty for none).
      - key: APP_PASSWORD
        sync: false
